<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

                    "primary": "#006a39",

                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#141b2b",
                    "on-surface": "#151c27",
                    "inverse-surface": "#2a313d",
                    "tertiary-fixed-dim": "#ffb2b8",
                    "surface-bright": "#f9f9ff",
                    "on-primary-container": "#f6fff4",

                    "secondary-container": "#d9dff5",

                    "full": "9999px"

            "spacing": {

                    "xl": "32px",
                    "base": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "gutter": "16px",

            },
            "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        /* Custom Elevation from Style Guidance */
        .shadow-level-1 { shadow: 0px 4px 20px rgba(0, 0, 0, 0.05); }
        .shadow-level-2 { shadow: 0px 10px 30px rgba(0, 0, 0, 0.08); }
        
        .backdrop-blur-custom {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        input:focus {
            box-shadow: 0 0 0 2px rgba(0, 106, 57, 0.1);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center w-full px-container-margin py-md shadow-sm">
<div class="flex items-center gap-md">
<button class="active:scale-95 transition-transform p-1">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Delivery Address</h1>
</div>
<div class="flex items-center">
<span class="font-label-sm text-label-sm text-primary font-bold">2 / 3 Steps</span>
</div>
</header>
<main class="px-container-margin pt-lg space-y-lg">
<!-- Map Preview / Current Location Action -->
<div class="relative w-full h-48 rounded-xl overflow-hidden bg-surface-container shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant">
<div class="w-full h-full bg-cover bg-center" data-location="San Francisco" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDoStEkXfOwkORcswjrDjdzCadLFT-MNz0x-Flm2A8PIYKveBqEwUwJZDcY8zyK6rm_qgOtB-pt5trjQ5aCRvn8UL_FX3xJAlT5DehZWURAzoo-pIXGf1hloSgK6Or4WEY03jeaPvg3OpU940Awb7NZ8itXwBCce_i8N92W9pqjfk44-HCUQu6iDTbQt4scq3UceNrBST8OjKxYtNDpXa1zxIg_Rn_uXz2EMXsC5ZAk3e_3_DWwXCc8')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent flex items-end p-md">
<button class="flex items-center gap-xs bg-surface text-primary font-bold py-sm px-md rounded-full shadow-lg active:scale-[0.98] transition-transform w-full justify-center group">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
<span class="font-title-md text-body-md">Use Current Location</span>
</button>
</div>
</div>
<!-- Form Section -->
<section class="space-y-md">
<div class="grid grid-cols-1 gap-md">
<!-- House / Flat Number -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">home</span>
                        House / Flat Number
                    </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-0 bg-surface-container-lowest text-on-surface transition-all" placeholder="e.g. Apt 4B, Emerald Heights" type="text"/>
</div>
<!-- Area / Locality -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">map</span>
                        Area / Locality
                    </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-0 bg-surface-container-lowest text-on-surface transition-all" placeholder="e.g. 5th Cross, Richmond Road" type="text"/>
</div>
<!-- Landmark -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">flag</span>
                        Landmark (Optional)
                    </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-0 bg-surface-container-lowest text-on-surface transition-all" placeholder="e.g. Near Central Park Entrance" type="text"/>
</div>
<!-- City & Pin Code Grid -->
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">location_city</span>
                            City
                        </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-high text-on-surface-variant font-semibold cursor-not-allowed" readonly="" type="text" value="San Francisco"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" style="font-size: 16px;">pin_drop</span>
                            Pin Code
                        </label>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-0 bg-surface-container-lowest text-on-surface transition-all" maxlength="6" placeholder="94105" type="tel"/>
</div>
</div>
</div>
</section>
<!-- Save As Pills (Bento style choice) -->
<section class="space-y-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant">SAVE ADDRESS AS</h3>
<div class="flex gap-sm">
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-xl bg-surface active:scale-95 transition-all" id="tag-home" onclick="selectTag('home')">
<span class="material-symbols-outlined text-on-surface-variant">home</span>
<span class="font-label-sm">Home</span>
</button>
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-xl bg-surface active:scale-95 transition-all" id="tag-work" onclick="selectTag('work')">
<span class="material-symbols-outlined text-on-surface-variant">work</span>
<span class="font-label-sm">Work</span>
</button>
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-xl bg-surface active:scale-95 transition-all" id="tag-other" onclick="selectTag('other')">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
<span class="font-label-sm">Other</span>
</button>
</div>
</section>
</main>
<!-- Sticky CTA -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md px-container-margin py-md border-t border-outline-variant/30 shadow-[0px_-10px_30px_rgba(0,0,0,0.08)]">
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center px-xs">
<div class="flex flex-col">
<span class="font-label-sm text-on-surface-variant">Deliver to</span>
<span class="font-title-md text-primary truncate max-w-[200px]">Waiting for address...</span>
</div>
<div class="text-right">
<span class="font-label-sm text-on-surface-variant">Estimated Time</span>
<span class="font-title-md text-primary block">25-30 min</span>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-md rounded-full font-headline-lg-mobile text-headline-lg-mobile shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-md group">
                Continue to Payment
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
<!-- UI State Manager Script -->
<script>
        function selectTag(type) {
            const tags = ['home', 'work', 'other'];
            tags.forEach(t => {
                const el = document.getElementById(`tag-${t}`);
                if (t === type) {
                    el.classList.remove('border-outline-variant', 'bg-surface');
                    el.classList.add('border-primary', 'bg-primary-container', 'text-on-primary-container');
                    el.querySelector('span:last-child').classList.add('font-bold');
                    const icon = el.querySelector('.material-symbols-outlined');
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    el.classList.add('border-outline-variant', 'bg-surface');
                    el.classList.remove('border-primary', 'bg-primary-container', 'text-on-primary-container');
                    el.querySelector('span:last-child').classList.remove('font-bold');
                    const icon = el.querySelector('.material-symbols-outlined');
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });
        }

        // Floating label micro-interaction (visual only for this demo)
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
