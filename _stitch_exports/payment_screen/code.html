</div>
<div>

</div>
</div>
<div class="mt-md flex gap-sm overflow-x-auto pb-1 no-scrollbar">
<div class="flex-shrink-0 px-sm py-1 bg-surface-container rounded-full border border-outline-variant text-[10px] font-bold text-on-surface-variant">G-PAY</div>

</div>

<div class="flex items-start gap-md">

                Place Order
            </button>

<!-- Script for interactive card highlighting -->
<script>
        const radioInputs = document.querySelectorAll('input[name="payment_method"]');
        const labels = document.querySelectorAll('label');

        function updateStyles() {
            labels.forEach(label => {
                const input = label.querySelector('input');
                if (input.checked) {
                    label.classList.add('payment-card-active');
                    label.classList.remove('border-outline-variant');
                } else {
                    label.classList.remove('payment-card-active');
                    label.classList.add('border-outline-variant');
                }
            });
        }

        radioInputs.forEach(input => {
            input.addEventListener('change', updateStyles);
        });

        // Initialize styles
        updateStyles();

        function handlePayment() {
            const selected = document.querySelector('input[name="payment_method"]:checked').value;
            const btn = event.currentTarget;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...`;
            btn.disabled = true;
            
            setTimeout(() => {
                alert(`Redirecting to ${selected.toUpperCase()} gateway...`);
                btn.innerHTML = "Place Order";
                btn.disabled = false;
            }, 1500);
        }
    </script>
