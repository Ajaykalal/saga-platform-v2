        }

        .btn-press:active {

            background: rgba(255, 255, 255, 0.8);

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-container-margin overflow-hidden relative">
<!-- Ambient Decorative Elements (Abstract tactile modernism) -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<main class="w-full max-w-md z-10">
<!-- Brand Identity / Header (TopAppBar Influence) -->
<header class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container text-on-primary-container rounded-xl shadow-sm mb-md">
<span class="material-symbols-outlined text-[32px]">restaurant</span>
</div>
<h1 class="font-display text-display text-on-surface tracking-tight">Saga Cafe</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Premium dining, playfully served.</p>
</header>
<!-- Main Registration Form Card (Level 1 Elevation) -->
<div class="glass-card bg-surface-container-lowest border border-outline-variant p-xl rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)]">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Get Started</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to start ordering.</p>
</div>
<form class="space-y-lg" id="registrationForm">
<!-- Name Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="name">NAME</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full h-[52px] pl-12 pr-md bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg form-input-focus transition-all placeholder:text-on-surface-variant/40" id="name" name="name" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Mobile Number Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="phone">MOBILE NUMBER</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">phone_iphone</span>
<input class="w-full h-[52px] pl-12 pr-md bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg form-input-focus transition-all placeholder:text-on-surface-variant/40" id="phone" name="phone" pattern="[0-9]{10,}" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Primary CTA (Emerald Green Button) -->
<button class="w-full h-12 bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-sm btn-press transition-all duration-150 flex items-center justify-center gap-xs mt-xl hover:bg-primary-container active:scale-95" type="submit">
                    Continue
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant flex flex-col items-center gap-md">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Footer Visual (Asymmetric Bento-ish Placeholder) -->

            By continuing, you agree to Saga Cafe's <br/>
<a class="underline" href="#">Terms of Service</a> and <a class="underline" href="#">Privacy Policy</a>.

</main>
<!-- Micro-interaction script -->
<script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Visual feedback for interaction
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-80');

            // Simulate navigation/transition
            setTimeout(() => {
                // Here we would normally navigate or show next step
                // Restoring for demo purposes
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                
                console.log('User Registered:', {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value
                });
            }, 1200);
        });

        // Simple input focus effects beyond CSS
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
