<!-- Interactive Layer: Gentle Particle Script -->
<canvas class="fixed inset-0 pointer-events-none z-0" id="atmosphereCanvas"></canvas>
<script>
        // Simple ambient background effect to enhance "Premium Playful" feel
        const canvas = document.getElementById('atmosphereCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.opacity = Math.random() * 0.4;
            }
            update() {
                this.y += this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(15, 157, 88, ${this.opacity})`; // Emerald green particles
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // Simulate a smooth transition to next screen after 3.5 seconds
        setTimeout(() => {
            document.body.style.transition = 'opacity 1s ease-out';
            document.body.style.opacity = '0';
        }, 3500);
    </script>
