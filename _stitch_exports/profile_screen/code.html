<!DOCTYPE html>

                    "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .safe-bottom { padding-bottom: 90px; }
    </style>
</head>
<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center w-full px-container-margin py-md shadow-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="restaurant">restaurant</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Saga Cafe</h1>
</div>
<div class="text-primary font-label-sm text-label-sm">
            Open Now • 25 min
        </div>
</header>
<main class="safe-bottom">
<!-- Hero Profile Section -->
<section class="px-container-margin py-xl flex flex-col items-center">
<div class="relative mb-md">
<div class="w-24 h-24 rounded-full overflow-hidden border-4 border-primary-container shadow-sm">
<img class="w-full h-full object-cover" data-alt="A professional, clean-cut portrait of a middle-aged man with a friendly smile, shot in high-key natural lighting against a minimalist cafe background. The image has a premium, airy feel with soft emerald green accents in the background decor, maintaining the high-end Saga Cafe brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqSynWpyHlxlmMLWLrQ3H0yyHhcGnthUDkoffnx442zfWYUgi5E5nC9fQxxX9CPQjJ_GZQ7UjpcAvmI_L34lsPLbHqC2eaD8B-H7tZUGpgFGn4dPY4eS9zcK6gSFkE7Ie0UpLUo9w1NTniLc4idVnIvadvLJdfbovnQ9z0fuvjthhegjWbVoZJ6ifecv4CPoKKfcmbsyDub50zt8Ubic-tf5zfycIArR814-x8eIW7JdfjfBFUO6Ya"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary p-xs rounded-full shadow-md hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</button>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">John Doe</h2>
<p class="font-body-md text-body-md text-on-surface-variant">+1 (555) 000-1234</p>
</section>
<!-- Profile Menu Items -->
<section class="px-container-margin space-y-md">
<!-- Bento-style Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden">
<!-- Saved Addresses -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</div>
<span class="font-title-md text-title-md text-on-surface">Saved Addresses</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/20 mx-md"></div>
<!-- My Orders -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>
<span class="font-title-md text-title-md text-on-surface">My Orders</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/20 mx-md"></div>
<!-- Help & Support -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="help">help</span>
</div>
<span class="font-title-md text-title-md text-on-surface">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/20 mx-md"></div>
<!-- Privacy Policy -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="policy">policy</span>
</div>
<span class="font-title-md text-title-md text-on-surface">Privacy Policy</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Logout Button (Separate for emphasis) -->
<button class="w-full flex items-center justify-center gap-sm p-md mt-lg bg-surface-container-lowest border border-error/20 text-error rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.02)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-title-md text-title-md">Logout</span>
</button>
</section>
<!-- Loyalty Card Teaser -->
<section class="px-container-margin mt-xl">
<div class="bg-primary p-lg rounded-xl text-on-primary shadow-lg overflow-hidden relative">
<!-- Abstract Pattern Background -->
<div class="absolute top-0 right-0 opacity-10 -translate-y-4 translate-x-4">
<span class="material-symbols-outlined text-[120px]" data-icon="loyalty">loyalty</span>
</div>
<div class="relative z-10">
<h3 class="font-title-md text-title-md mb-xs">Saga Gold Member</h3>
<p class="font-body-md text-body-md opacity-90 mb-md">You're 4 orders away from a free coffee!</p>
<div class="w-full bg-on-primary/20 h-2 rounded-full mb-xs">
<div class="bg-primary-fixed-dim h-full rounded-full w-[60%]"></div>
</div>
<div class="flex justify-between font-label-sm text-label-sm">
<span>6 Orders</span>
<span>10 Orders</span>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-xs py-sm bg-surface shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] border-t border-outline-variant/30 rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity px-4 py-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity px-4 py-1">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-sm text-label-sm">Menu</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity px-4 py-1">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Cart</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity px-4 py-1">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-sm text-label-sm">Orders</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-4 py-1 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            });
        });

        // Sticky header transition logic
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
</body></html>
